<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#FAFAFA"/>

  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1A202C">AustralMarket — Arquitectura Serverless (Sprint 1)</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#718096">Base de datos: Aurora DSQL (PostgreSQL, distribuida, sin servidor)</text>

  <!-- Browser -->
  <rect x="500" y="100" width="200" height="60" rx="10" fill="#EDF2F7" stroke="#4A5568" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="#1A202C">Navegador del usuario</text>
  <text x="600" y="144" text-anchor="middle" font-size="12" fill="#4A5568">(React, cliente)</text>

  <!-- Legend -->
  <g transform="translate(870,95)">
    <rect x="0" y="0" width="300" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="14" y="20" font-size="12" font-weight="700" fill="#1A202C">Leyenda de flujos</text>
    <line x1="14" y1="36" x2="44" y2="36" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="52" y="40" font-size="11.5" fill="#2D3748">1. Contenido estático (una vez)</text>
    <line x1="14" y1="58" x2="44" y2="58" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="52" y="62" font-size="11.5" fill="#2D3748">2. Datos dinámicos (repetido)</text>
    <line x1="14" y1="80" x2="44" y2="80" stroke="#2F855A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="52" y="84" font-size="11.5" fill="#2D3748">3. Imágenes (directo a S3)</text>
    <line x1="14" y1="102" x2="44" y2="102" stroke="#6B46C1" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <text x="52" y="106" font-size="11.5" fill="#2D3748">4. Autenticación (Cognito)</text>
  </g>

  <!-- Momento 1: static -->
  <rect x="140" y="220" width="230" height="70" rx="10" fill="#F7FAFC" stroke="#4A5568" stroke-width="2"/>
  <text x="255" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#1A202C">Amplify Hosting</text>
  <text x="255" y="266" text-anchor="middle" font-size="11.5" fill="#4A5568">+ CloudFront (CDN interna)</text>
  <text x="255" y="281" text-anchor="middle" font-size="10.5" fill="#718096">sirve HTML/CSS/JS compilado</text>

  <path d="M540,130 Q380,150 260,220" fill="none" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="380" y="185" text-anchor="middle" font-size="11" fill="#4A5568">GET /</text>

  <!-- Momento 2: dynamic -->
  <rect x="500" y="220" width="200" height="60" rx="10" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="600" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#1A365D">API Gateway</text>
  <text x="600" y="263" text-anchor="middle" font-size="11" fill="#2C5282">HTTP API</text>

  <line x1="600" y1="160" x2="600" y2="220" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="608" y="192" font-size="11" fill="#2C5282">fetch productos</text>

  <rect x="500" y="330" width="200" height="60" rx="10" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="600" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#1A365D">AWS Lambda</text>
  <text x="600" y="373" text-anchor="middle" font-size="11" fill="#2C5282">lógica de negocio</text>

  <line x1="600" y1="280" x2="600" y2="330" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <rect x="500" y="440" width="200" height="75" rx="10" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="600" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#1A365D">Aurora DSQL</text>
  <text x="600" y="484" text-anchor="middle" font-size="11" fill="#2C5282">PostgreSQL — FK nativa</text>
  <text x="600" y="500" text-anchor="middle" font-size="10" fill="#4682B4">tablas: artesanos, productos</text>

  <line x1="600" y1="390" x2="600" y2="440" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="608" y="418" font-size="10.5" fill="#2C5282">SQL (JOIN por artesano_id)</text>

  <!-- Momento 3: S3 images -->
  <rect x="850" y="330" width="200" height="60" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="2"/>
  <text x="950" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#22543D">Amazon S3</text>
  <text x="950" y="373" text-anchor="middle" font-size="11" fill="#276749">imágenes de productos</text>

  <path d="M700,160 Q900,220 950,330" fill="none" stroke="#2F855A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="880" y="240" text-anchor="middle" font-size="11" fill="#276749">&lt;img src="..."&gt;</text>

  <text x="950" y="415" text-anchor="middle" font-size="10" fill="#718096">La BD solo guarda la URL,</text>
  <text x="950" y="430" text-anchor="middle" font-size="10" fill="#718096">no el archivo</text>

  <!-- Momento 4: Cognito -->
  <rect x="850" y="220" width="200" height="60" rx="10" fill="#FAF5FF" stroke="#6B46C1" stroke-width="2"/>
  <text x="950" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#44337A">Amazon Cognito</text>
  <text x="950" y="263" text-anchor="middle" font-size="11" fill="#553C9A">User Pool (login/signup)</text>

  <path d="M700,140 Q820,170 900,220" fill="none" stroke="#6B46C1" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="810" y="165" text-anchor="middle" font-size="10.5" fill="#553C9A">login</text>

  <path d="M950,280 Q950,300 700,240" fill="none" stroke="#6B46C1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowPurple)"/>
  <text x="850" y="300" text-anchor="middle" font-size="10" fill="#553C9A">JWT en Authorization header</text>

</svg>
